version: 2
project_name: playground
release:
  draft: true
  prerelease: auto
  extra_files:
    - glob: dist/playground.oci.tar
    - glob: dist/image.json
builds:
  - id: api
    main: ./cmd/playground
    binary: playground
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w -X main.releaseVersion={{ .Version }}
    hooks:
      post:
        - cmd: >-
            bash scripts/release/image.sh "{{ .Path }}" "{{ .Version }}"
            "ghcr.io/montferret/{{ .ProjectName }}"
            "us-east1-docker.pkg.dev/montferret/playground/{{ .ProjectName }}"
            "{{ .Major }}.{{ .Minor }}" "{{ if .IsSnapshot }}snapshot{{ else if .Prerelease }}prerelease{{ else }}stable{{ end }}"
archives:
  - id: linux
    ids: [api]
    formats: [tar.gz]
checksum:
  name_template: '{{ .ProjectName }}_checksums.txt'
snapshot:
  version_template: '{{ .Version }}-snapshot-{{ .ShortCommit }}'
publishers:
  - name: registries
    ids: [linux]
    # Extra release files bypass the archive ID filter. Publish the OCI asset once.
    cmd: '{{ if eq .ArtifactName "playground.oci.tar" }}bash scripts/release/publish.sh{{ else }}true{{ end }}'
    env:
      - GH_TOKEN={{ .Env.GITHUB_TOKEN }}
      # Custom publishers do not inherit Skopeo's runtime/auth environment.
      - REGISTRY_AUTH_FILE={{ if isEnvSet "REGISTRY_AUTH_FILE" }}{{ .Env.REGISTRY_AUTH_FILE }}{{ else if isEnvSet "DOCKER_CONFIG" }}{{ .Env.DOCKER_CONFIG }}/config.json{{ else }}{{ .Env.HOME }}/.docker/config.json{{ end }}
