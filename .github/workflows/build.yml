name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: make check
  packaged:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: goreleaser/goreleaser-action@v7
        with: {distribution: goreleaser, version: v2.19.0, install-only: true}
      - run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - run: make release-snapshot
