openapi: 3.0.3
info:
  title: Ferret Playground API
  version: v1
  description: >-
    REST contract version, independent of service and runtime versions.
    Environment discovery, analysis, formatting, compilation, and execution are implemented. Program outcomes use operation models.
    Service and HTTP failures use Error. Source names are diagnostic labels,
    never instructions to open host files. Initial execution is buffered JSON,
    not an HTTP streaming protocol.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Environment
  - name: Tooling
  - name: Execution
paths:
  /api/v1/environment:
    options:
      operationId: preflightEnvironment
      x-implementation-status: implemented
      summary: Check an exact-origin CORS preflight for this route
      responses:
        '204':
          description: Configured origin, route method, and requested headers permitted
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}}
            Access-Control-Allow-Methods: {schema: {type: string}}
            Access-Control-Allow-Headers: {schema: {type: string}}
            Vary: {schema: {type: string}}
        '403':
          description: Origin, method, or requested headers denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    get:
      operationId: getEnvironment
      tags: [Environment]
      summary: Describe the initialized runtime and working service capabilities
      x-implementation-status: implemented
      description: >-
        Performs no FQL evaluation, browser startup, or external request.
        GET and CORS preflight are supported. Other methods receive 405 with Allow: GET;
        HEAD error responses have no body. Unknown paths receive Error with 404.
      responses:
        '200':
          description: Initialized runtime, capabilities, and effective HTTP, tooling, and execution limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
              example:
                apiVersion: v1
                service: {name: ferret-playground, version: null}
                runtime:
                  name: ferret
                  version: v2.0.0-alpha.61
                  standardLibrary: safe
                  modules: []
                capabilities:
                  environment: true
                  analyze: true
                  format: true
                  compile: true
                  execute: true
                  debug: false
                  functionCatalog: false
                  optimizationLevels: [none, basic, full]
                  defaultOptimization: full
                  inspectionArtifacts: [bytecode, parameters]
                limits:
                  http:
                    maxHeaderBytes: 16384
                    maxRequestBodyBytes: 1048576
                    maxResponseBytes: 2097152
                    readHeaderTimeoutMs: 5000
                    readTimeoutMs: 10000
                    writeTimeoutMs: 15000
                    idleTimeoutMs: 60000
                  execution: {maxConcurrentExecutions: 2, maxTimeoutMs: 5000, maxOutputBytes: 1048576}
                  tooling:
                    maxSourceBytes: 65536
                    maxBytecodeBytes: 1048576
                    maxFormattedSourceBytes: 1048576
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestCanceled'
        '422':
          $ref: '#/components/responses/ResponseTooLarge'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/analyze:
    options:
      operationId: preflightAnalyze
      x-implementation-status: implemented
      summary: Check an exact-origin CORS preflight for this route
      responses:
        '204':
          description: Configured origin, route method, and requested headers permitted
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}}
            Access-Control-Allow-Methods: {schema: {type: string}}
            Access-Control-Allow-Headers: {schema: {type: string}}
            Vary: {schema: {type: string}}
        '403':
          description: Origin, method, or requested headers denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      operationId: analyzeSource
      tags: [Tooling]
      summary: Native compilation checks without execution
      x-implementation-status: implemented
      description: >-
        Performs the checks available through native compilation, using full
        optimization, and closes the temporary plan. Does not bind parameter
        values or resolve host functions; ok does not prove runtime success.
        No program is executed. Cancellation is checked between synchronous
        phases, which cannot be forcibly interrupted.
      requestBody:
        $ref: '#/components/requestBodies/Source'
      responses:
        '200':
          description: Analysis outcome; invalid source is not an HTTP failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
              example: {status: ok, diagnostics: []}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '408':
          $ref: '#/components/responses/RequestCanceled'
        '422':
          $ref: '#/components/responses/ResponseTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/format:
    options:
      operationId: preflightFormat
      x-implementation-status: implemented
      summary: Check an exact-origin CORS preflight for this route
      responses:
        '204':
          description: Configured origin, route method, and requested headers permitted
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}}
            Access-Control-Allow-Methods: {schema: {type: string}}
            Access-Control-Allow-Headers: {schema: {type: string}}
            Vary: {schema: {type: string}}
        '403':
          description: Origin, method, or requested headers denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      operationId: formatSource
      tags: [Tooling]
      summary: Format FQL with native defaults
      x-implementation-status: implemented
      description: >-
        Accepts source only. Formats without compiling, resolving host functions,
        or executing FQL. Success includes the complete formattedSource string.
        Syntax errors return invalid with structured diagnostics. Cancellation and
        the formatted-source byte limit are checked during writes. Partial output
        is discarded on failure.
      requestBody:
        $ref: '#/components/requestBodies/Source'
      responses:
        '200':
          description: Complete formatted source on success or diagnostics for invalid FQL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatResponse'
              example: {status: ok, diagnostics: [], formattedSource: 'return 1'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '408':
          $ref: '#/components/responses/RequestCanceled'
        '422':
          $ref: '#/components/responses/ResponseTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/compile:
    options:
      operationId: preflightCompile
      x-implementation-status: implemented
      summary: Check an exact-origin CORS preflight for this route
      responses:
        '204':
          description: Configured origin, route method, and requested headers permitted
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}}
            Access-Control-Allow-Methods: {schema: {type: string}}
            Access-Control-Allow-Headers: {schema: {type: string}}
            Vary: {schema: {type: string}}
        '403':
          description: Origin, method, or requested headers denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      operationId: compileSource
      tags: [Tooling]
      summary: Compile once and return requested inspection artifacts
      x-implementation-status: implemented
      description: >-
        Uses the configured native engine without execution or parameter binding.
        include accepts bytecode and parameters, without duplicate names; omitted
        or empty include yields artifacts: {}. Parameter names are distinct and
        ordered by native first encounter, with no inferred types or requiredness.
        Bytecode is upstream text disassembly, specific to the runtime version.
        Ferret materializes the full disassembly before the byte limit is checked;
        this is a response-size limit, not an allocation bound. Oversized artifacts
        or encoded responses receive 422, without truncation. compileMs measures
        native compilation only, excluding artifact rendering and plan closure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileRequest'
            example:
              source: {text: 'RETURN @value', name: example.fql}
              options: {optimization: full}
              include: [parameters, bytecode]
      responses:
        '200':
          description: Compilation outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileResponse'
              example: {status: ok, diagnostics: [], artifacts: {parameters: [value], bytecode: {format: text, text: "<native disassembly>"}}, timings: {compileMs: 0.4}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '408':
          $ref: '#/components/responses/RequestCanceled'
        '422':
          $ref: '#/components/responses/ResponseTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/execute:
    options:
      operationId: preflightExecute
      x-implementation-status: implemented
      summary: Check an exact-origin CORS preflight for this route
      responses:
        '204':
          description: Configured origin, route method, and requested headers permitted
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}}
            Access-Control-Allow-Methods: {schema: {type: string}}
            Access-Control-Allow-Headers: {schema: {type: string}}
            Vary: {schema: {type: string}}
        '403':
          description: Origin, method, or requested headers denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      operationId: executeSource
      tags: [Execution]
      summary: Compile once and return the bounded JSON result of one native run
      x-implementation-status: implemented
      description: >-
        Uses the configured host and a fresh session. The earliest of the request
        deadline, server maximum, and optional client timeout covers compilation
        through terminal output consumption. maxOutputBytes bounds retained encoded
        result bytes. The VM and native encoder may allocate more. Only a complete
        successful JSON value is delivered. A successful run without content omits
        output. Present zero-byte or malformed JSON is an internal service error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
            example: {source: {text: 'RETURN @value'}, params: {value: null}}
      responses:
        '200':
          description: Complete program outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
              examples:
                successfulNull:
                  value:
                    status: ok
                    diagnostics: []
                    output: null
                    timings: {compileMs: 0.3, executeMs: 0.2, totalMs: 0.6}
                failureWithoutOutput:
                  value:
                    status: failed
                    diagnostics:
                      - severity: error
                        phase: execute
                        code: execution_timeout
                        message: The execution deadline expired.
                    timings: {compileMs: 0.3, executeMs: 10, totalMs: 10.4}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '408':
          $ref: '#/components/responses/RequestCanceled'
        '422':
          $ref: '#/components/responses/ResponseTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  requestBodies:
    Source:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceRequest'
          example: {source: {text: 'RETURN 1', name: example.fql}}
  responses:
    BadRequest:
      description: Malformed JSON, trailing documents, null/missing required values, duplicate or unknown fields, or invalid options
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested route does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: {code: not_found, message: The requested route does not exist.}}
    MethodNotAllowed:
      description: Unsupported method on an implemented route; HEAD has no response body
      headers:
        Allow:
          description: Methods currently implemented by this route
          required: true
          schema: {type: string}
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: {code: method_not_allowed, message: This route supports GET.}}
    TooLarge:
      description: Request body or UTF-8 source exceeds its configured byte limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: POST requires application/json, optionally with charset=utf-8
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestCanceled:
      description: Request canceled or deadline expired; synchronous native phases are not preempted, and disconnected clients may receive no response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: {code: request_canceled, message: The request was canceled.}}
    ResponseTooLarge:
      description: Formatted source, a generated artifact, or the complete JSON response exceeds its byte limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: {code: response_too_large, message: The generated response exceeds the configured limit.}}
    RateLimited:
      description: All execution slots are occupied. Rejected before the request body is read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: {code: execution_capacity_exceeded, message: All execution slots are occupied.}}
    InternalError:
      description: Internal service failure, distinct from submitted-program outcomes; no internal error details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: {code: internal_error, message: The service could not complete the request.}}
    Unavailable:
      description: The service is draining and cannot admit new work
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Environment:
      type: object
      additionalProperties: false
      required: [apiVersion, service, runtime, capabilities, limits]
      properties:
        apiVersion: {type: string, enum: [v1]}
        service:
          type: object
          additionalProperties: false
          required: [name, version]
          properties:
            name: {type: string, enum: [ferret-playground]}
            version: {type: string, nullable: true, description: 'Service build version, null when unavailable in development'}
        runtime:
          type: object
          additionalProperties: false
          required: [name, version, standardLibrary, modules]
          properties:
            name: {type: string, enum: [ferret]}
            version: {type: string, nullable: true, description: 'Embedded dependency version, null when unavailable; never the service or compiler version'}
            standardLibrary: {type: string, enum: [safe]}
            modules:
              type: array
              items:
                $ref: '#/components/schemas/Module'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        limits:
          type: object
          additionalProperties: false
          required: [http, tooling, execution]
          properties:
            http:
              $ref: '#/components/schemas/HTTPLimits'
            execution:
              $ref: '#/components/schemas/ExecutionLimits'
            tooling:
              $ref: '#/components/schemas/ToolingLimits'
    Module:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string, minLength: 1}
        version: {type: string, nullable: true, description: 'Host-supplied registration metadata, null when unavailable'}
    Capabilities:
      type: object
      additionalProperties: false
      required: [environment, analyze, format, compile, execute, debug, functionCatalog, optimizationLevels, defaultOptimization, inspectionArtifacts]
      description: Environment discovery, analysis, formatting, compilation, and execution are available
      properties:
        environment: {type: boolean}
        analyze: {type: boolean}
        format: {type: boolean}
        compile: {type: boolean}
        execute: {type: boolean}
        debug: {type: boolean}
        functionCatalog: {type: boolean}
        optimizationLevels:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Optimization'
        defaultOptimization:
          $ref: '#/components/schemas/Optimization'
        inspectionArtifacts:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/InspectionArtifact'
    HTTPLimits:
      type: object
      additionalProperties: false
      required: [maxHeaderBytes, maxRequestBodyBytes, maxResponseBytes, readHeaderTimeoutMs, readTimeoutMs, writeTimeoutMs, idleTimeoutMs]
      description: Configured net/http settings, not execution limits; maxHeaderBytes is the server field, not an exact wire-byte cap
      properties:
        maxHeaderBytes: {type: integer, minimum: 1}
        maxRequestBodyBytes: {type: integer, minimum: 1, description: "POST body bytes enforced while reading"}
        maxResponseBytes: {type: integer, minimum: 256, description: "Complete encoded application JSON bytes including newline; checked after encoding"}
        readHeaderTimeoutMs: {type: number, minimum: 0, exclusiveMinimum: true}
        readTimeoutMs: {type: number, minimum: 0, exclusiveMinimum: true}
        writeTimeoutMs: {type: number, minimum: 0, exclusiveMinimum: true}
        idleTimeoutMs: {type: number, minimum: 0, exclusiveMinimum: true}
    ExecutionLimits:
      type: object
      additionalProperties: false
      required: [maxConcurrentExecutions, maxTimeoutMs, maxOutputBytes]
      properties:
        maxConcurrentExecutions: {type: integer, minimum: 1}
        maxTimeoutMs: {type: number, minimum: 0, exclusiveMinimum: true, description: "Effective server deadline in milliseconds"}
        maxOutputBytes: {type: integer, minimum: 1, description: "Maximum encoded result bytes retained for delivery, inclusive"}
    ToolingLimits:
      type: object
      additionalProperties: false
      required: [maxSourceBytes, maxBytecodeBytes, maxFormattedSourceBytes]
      properties:
        maxSourceBytes: {type: integer, minimum: 1, description: "UTF-8 source bytes checked before native tooling"}
        maxBytecodeBytes: {type: integer, minimum: 1, description: "Disassembly text bytes checked after upstream materialization; not an allocation bound"}
        maxFormattedSourceBytes: {type: integer, minimum: 1, description: "Maximum UTF-8 bytes of formatted source, enforced during writing before JSON encoding"}
    Source:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, description: 'Required source text; empty text produces a program diagnostic, not a missing-field error'}
        name: {type: string, description: 'Optional display label, never a host filesystem instruction'}
      example: {text: 'RETURN 1', name: example.fql}
    SourceRequest:
      type: object
      additionalProperties: false
      required: [source]
      description: >-
        Finite body limit enforced while reading, including chunked requests;
        application/json with no parameter or charset=utf-8; one non-null JSON
        object only. Reject malformed or trailing documents, unknown or duplicate
        object fields, null/missing source text, and unsupported options.
        Property names are case-sensitive. Omitted source name uses anonymous.
      properties:
        source:
          $ref: '#/components/schemas/Source'
    BindParameters:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/JSONValue'
      description: JSON bind values decoded by the native JSON codec. Signed 64-bit integer literals retain their precision. Object keys must be unique at every depth.
      example: {value: null, nested: {items: [1, true, text]}}
    JSONValue:
      description: Any JSON value, including null, without imposing a new Ferret value encoding
      anyOf:
        - {type: string, nullable: true}
        - {type: number}
        - {type: boolean}
        - type: array
          items:
            $ref: '#/components/schemas/JSONValue'
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/JSONValue'
    Position:
      type: object
      additionalProperties: false
      required: [line, character]
      properties:
        line: {type: integer, minimum: 0, description: "Zero-based line"}
        character: {type: integer, minimum: 0, description: "Zero-based UTF-16 code units within the line"}
    Location:
      type: object
      additionalProperties: false
      required: [source]
      description: >-
        Source identity is the submitted display name (or anonymous when omitted).
        Native one-based UTF-8 byte columns and byte spans must be converted
        using the submitted text. Do not pass UAPI's producer-defined locations
        straight through. CRLF is one line break; supplementary code points use
        two UTF-16 units. The range end is exclusive, including zero-width EOF ranges.
        Omit range when upstream provides no usable span; retain source identity.
      properties:
        source: {type: string}
        range:
          type: object
          additionalProperties: false
          required: [start, end]
          properties:
            start:
              $ref: '#/components/schemas/Position'
            end:
              $ref: '#/components/schemas/Position'
    Diagnostic:
      type: object
      additionalProperties: false
      required: [severity, phase, message]
      properties:
        severity: {type: string, enum: [error, warning, info]}
        phase: {type: string, enum: [parse, analyze, format, compile, execute, output]}
        message: {type: string}
        code: {type: string, description: "Stable category on failed execution, one of runtime_error, execution_timeout, or output_too_large. Omitted for compiler diagnostics."}
        location:
          $ref: '#/components/schemas/Location'
        hint: {type: string}
      example:
        severity: error
        phase: compile
        message: Example source diagnostic.
        location: {source: example.fql, range: {start: {line: 0, character: 0}, end: {line: 0, character: 1}}}
    Diagnostics:
      type: array
      items:
        $ref: '#/components/schemas/Diagnostic'
    Optimization:
      type: string
      enum: [none, basic, full]
      default: full
      description: Native-supported levels; UAPI aggressive is not supported by this runtime
    CompilationOptions:
      type: object
      additionalProperties: false
      properties:
        optimization:
          $ref: '#/components/schemas/Optimization'
    InspectionArtifact:
      type: string
      enum: [bytecode, parameters]
    CompileRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/Source'
        options:
          $ref: '#/components/schemas/CompilationOptions'
        include:
          type: array
          uniqueItems: true
          default: []
          description: Only requested artifacts are returned; duplicate names are invalid
          items:
            $ref: '#/components/schemas/InspectionArtifact'
    ExecuteRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/Source'
        options:
          type: object
          additionalProperties: false
          properties:
            optimization:
              $ref: '#/components/schemas/Optimization'
            timeoutMs:
              type: integer
              format: int64
              minimum: 1
              maximum: 9223372036854775807
              description: Positive integer literal in milliseconds. Larger values within int64 are capped at the server maximum.
        params:
          $ref: '#/components/schemas/BindParameters'
    AnalysisResponse:
      type: object
      additionalProperties: false
      required: [status, diagnostics]
      properties:
        status: {type: string, enum: [ok, invalid]}
        diagnostics:
          $ref: '#/components/schemas/Diagnostics'
    InvalidResponse:
      type: object
      additionalProperties: false
      required: [status, diagnostics]
      properties:
        status: {type: string, enum: [invalid]}
        diagnostics:
          $ref: '#/components/schemas/Diagnostics'
    FormatResponse:
      oneOf:
        - $ref: '#/components/schemas/FormatSuccess'
        - $ref: '#/components/schemas/InvalidResponse'
    FormatSuccess:
      type: object
      additionalProperties: false
      required: [status, diagnostics, formattedSource]
      properties:
        status: {type: string, enum: [ok]}
        diagnostics:
          $ref: '#/components/schemas/Diagnostics'
        formattedSource: {type: string}
    CompileResponse:
      oneOf:
        - $ref: '#/components/schemas/CompileSuccess'
        - $ref: '#/components/schemas/CompileInvalid'
    CompileSuccess:
      type: object
      additionalProperties: false
      required: [status, diagnostics, artifacts, timings]
      properties:
        status: {type: string, enum: [ok]}
        diagnostics:
          $ref: '#/components/schemas/Diagnostics'
        artifacts:
          type: object
          additionalProperties: false
          description: Only requested entries; an empty include returns an empty object
          properties:
            parameters:
              type: array
              uniqueItems: true
              description: Referenced bind-parameter names in native first-seen order, without types, values, defaults, or requiredness; requested empty metadata is []
              items: {type: string}
            bytecode:
              type: object
              additionalProperties: false
              required: [format, text]
              properties:
                format: {type: string, enum: [text]}
                text: {type: string, description: "Opaque upstream disassembly display text, specific to the runtime version"}
        timings:
          $ref: '#/components/schemas/CompileTimings'
    CompileInvalid:
      type: object
      additionalProperties: false
      required: [status, diagnostics, timings]
      properties:
        status: {type: string, enum: [invalid]}
        diagnostics:
          $ref: '#/components/schemas/Diagnostics'
        timings:
          $ref: '#/components/schemas/CompileTimings'
    CompileTimings:
      type: object
      additionalProperties: false
      required: [compileMs]
      properties:
        compileMs: {type: number, minimum: 0, description: "Monotonic elapsed native Engine.Compile milliseconds, including its hooks, excluding source construction, artifacts, and plan cleanup"}
    Timings:
      type: object
      additionalProperties: false
      required: [totalMs]
      description: >-
        Monotonic elapsed milliseconds. Phase values appear only when that phase
        was reached. compileMs measures the native compile call. executeMs covers
        session creation through terminal output consumption. totalMs includes
        operation cleanup and excludes HTTP encoding.
      properties:
        compileMs: {type: number, minimum: 0}
        executeMs: {type: number, minimum: 0}
        totalMs: {type: number, minimum: 0}
    ExecutionResponse:
      oneOf:
        - $ref: '#/components/schemas/ExecutionSuccess'
        - $ref: '#/components/schemas/ExecutionInvalid'
        - $ref: '#/components/schemas/ExecutionFailure'
    ExecutionSuccess:
      type: object
      additionalProperties: false
      required: [status, diagnostics, timings]
      description: Output is present for all encoded values including null. Absent content omits the field.
      properties:
        status: {type: string, enum: [ok]}
        diagnostics:
          $ref: '#/components/schemas/Diagnostics'
        output:
          $ref: '#/components/schemas/JSONValue'
        timings:
          $ref: '#/components/schemas/Timings'
    ExecutionInvalid:
      type: object
      additionalProperties: false
      required: [status, diagnostics, timings]
      properties:
        status: {type: string, enum: [invalid]}
        diagnostics:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Diagnostic'
        timings:
          $ref: '#/components/schemas/Timings'
    ExecutionFailure:
      type: object
      additionalProperties: false
      required: [status, diagnostics, timings]
      description: A runtime error or execution limit omits output and reports a stable diagnostic category.
      properties:
        status: {type: string, enum: [failed]}
        diagnostics:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: '#/components/schemas/Diagnostic'
              - type: object
                required: [code]
                properties:
                  code: {type: string, enum: [runtime_error, execution_timeout, output_too_large]}
                  phase: {type: string, enum: [execute, output]}
                  severity: {type: string, enum: [error]}
        timings:
          $ref: '#/components/schemas/Timings'
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, not_found, method_not_allowed, request_too_large, unsupported_media_type, request_canceled, request_timeout, response_too_large, rate_limited, execution_capacity_exceeded, cors_denied, internal_error, service_unavailable]
            message: {type: string, minLength: 1}
